<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VPN Exit Bench</title>
<style>
body{font-family:system-ui;background:#11151a;color:#e9eef5;margin:0}main{max-width:1200px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#9aa7b4}.card{background:#181e25;border:1px solid #29313a;border-radius:12px;padding:16px;margin:14px 0}button{background:#2c78ff;color:white;border:0;border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer}button.secondary{background:#313a45}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #2a323c;text-align:left;font-size:14px}th{color:#9fb0c1}.ok{color:#45d483}.bad{color:#ff6b6b}.pill{padding:3px 7px;border-radius:999px;background:#2a3340;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{margin:0 0 4px;font-size:28px}code{color:#c6d4e3}
</style></head><body><main><div class="top"><div><h1>VPN Exit Bench</h1><div class="muted">WireGuard & OpenVPN Exit-Standorte vergleichen</div></div><button id="all">Alle nacheinander testen</button></div>
<div class="card"><b>Configs</b><div id="configs" class="muted" style="margin-top:10px">Lade…</div></div>
<div class="card"><div class="row"><b>Ergebnisse</b><button class="secondary" onclick="loadResults()">Aktualisieren</button></div><div style="overflow:auto"><table><thead><tr><th>Status</th><th>Anbieter</th><th>Config</th><th>Exit</th><th>Ping</th><th>Jitter</th><th>Loss</th><th>Download</th><th>Zeit</th></tr></thead><tbody id="results"></tbody></table></div></div>
<script>
async function loadConfigs(){let x=await (await fetch('/api/configs')).json();let el=document.querySelector('#configs');if(!x.length){el.innerHTML='Keine Configs gefunden. Lege <code>.conf</code> oder <code>.ovpn</code> unter <code>/config/vpns/&lt;Anbieter&gt;/</code> ab.';return}el.innerHTML='';x.forEach(c=>{let d=document.createElement('div');d.className='row';d.style.margin='8px 0';d.innerHTML=`<span class="pill">${c.provider}</span><span>${c.name}</span><span class="muted">${c.type}</span><button>Testen</button>`;d.querySelector('button').onclick=()=>run(c,d.querySelector('button'));el.appendChild(d)})}
async function run(c,b){b.disabled=true;b.textContent='Teste…';try{await fetch('/api/test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rel:c.rel})});await loadResults()}finally{b.disabled=false;b.textContent='Testen'}}
async function loadResults(){let x=await (await fetch('/api/results')).json();let el=document.querySelector('#results');el.innerHTML='';x.forEach(r=>{let p=r.ping||{},d=r.download||{},e=r.exit||{};let tr=document.createElement('tr');tr.innerHTML=`<td class="${r.ok?'ok':'bad'}">${r.ok?'OK':'Fehler'}</td><td>${r.provider}</td><td title="${r.error||''}">${r.name}</td><td>${[e.city,e.country,e.ip].filter(Boolean).join(' / ')||'–'}</td><td>${p.avg_ms??'–'} ms</td><td>${p.jitter_ms??'–'} ms</td><td>${p.loss_pct??'–'} %</td><td><b>${d.mbps??'–'} Mbps</b></td><td>${new Date(r.ts*1000).toLocaleString()}</td>`;el.appendChild(tr)})}
document.querySelector('#all').onclick=async e=>{e.target.disabled=true;e.target.textContent='Teste alle…';try{await fetch('/api/test-all',{method:'POST'});await loadResults()}finally{e.target.disabled=false;e.target.textContent='Alle nacheinander testen'}};loadConfigs();loadResults();
</script></main></body></html>
