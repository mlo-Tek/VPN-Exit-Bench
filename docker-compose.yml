services:
  vpn-exit-bench:
    build: .
    image: vpn-exit-bench:latest
    container_name: vpn-exit-bench
    ports:
      - "8787:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/cache/appdata/vpn-exit-bench:/config
    environment:
      - HOST_CONFIG_DIR=/mnt/cache/appdata/vpn-exit-bench/vpns
      - WORKER_IMAGE=vpn-exit-bench:latest
      - DOWNLOAD_MB=100
    restart: unless-stopped
